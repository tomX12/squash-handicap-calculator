<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squash Handicap Calculator</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Card Container */
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
      color: #2c5364;
    }

    label {
      font-size: 1rem;
      display: block;
      margin-top: 1rem;
      text-align: left;
      color: #444;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 10px;
      transition: border-color 0.3s;
    }
    input:focus {
      border-color: #0078d7;
      outline: none;
    }

    button {
      margin-top: 1.5rem;
      padding: 14px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0078d7, #005ea0);
      color: white;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, background 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0090ff, #006bb3);
    }

    #result {
      margin-top: 1.5rem;
      font-weight: bold;
      font-size: 1.2rem;
      color: #2c5364;
      background: #f0f8ff;
      padding: 1rem;
      border-radius: 12px;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏆 Squash Handicap Calculator</h2>
    
    <label for="h1">Handicap Player 1:</label>
    <input type="number" id="h1" placeholder="e.g. -20, 5, 9">
    
    <label for="h2">Handicap Player 2:</label>
    <input type="number" id="h2" placeholder="e.g. -25, 0, 8">
    
    <button onclick="calculate()">Calculate Starting Scores</button>
    
    <div id="result"></div>
  </div>

  <script>
    function calculateStartingScores(h1, h2) {
      // Case A: both positive
      if (h1 >= 0 && h2 >= 0) {
        let lower = Math.min(h1, h2);
        let higher = Math.max(h1, h2);
        return [
          h1 === lower ? 0 : higher - lower,
          h2 === lower ? 0 : higher - lower
        ];
      }

      // Case B: both negative
      if (h1 < 0 && h2 < 0) {
        let higher = Math.max(h1, h2); // closer to zero
        let lower = Math.min(h1, h2);  // more negative
        return [
          h1 === higher ? 0 : lower - higher,
          h2 === higher ? 0 : lower - higher
        ];
      }

      // Case C: one positive, one negative
      let pos = h1 >= 0 ? h1 : h2;
      let neg = h1 < 0 ? h1 : h2;

      if (pos > 8) {
        return [h1, h2];
      } else {
        let adjust = 8 - pos;
        return [
          h1 >= 0 ? h1 + adjust : h1 + adjust,
          h2 >= 0 ? h2 + adjust : h2 + adjust
        ];
      }
    }

    function calculate() {
      let h1 = parseInt(document.getElementById("h1").value);
      let h2 = parseInt(document.getElementById("h2").value);

      if (isNaN(h1) || isNaN(h2)) {
        document.getElementById("result").innerHTML = "⚠️ Please enter both handicaps.";
        return;
      }

      let scores = calculateStartingScores(h1, h2);
      document.getElementById("result").innerHTML =
        `🎾 Player 1 starts at <b>${scores[0]}</b><br>🎾 Player 2 starts at <b>${scores[1]}</b>`;
    }
  </script>
</body>
</html>
